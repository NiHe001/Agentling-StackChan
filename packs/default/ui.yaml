canvas:
  width: 320
  height: 240

usage_aliases:
  five_hour:
    source: codex
    match:
      duration_mins: 300
  weekly:
    source: codex
    match:
      duration_mins: 10080

layouts:
  base:
    widgets:
      - id: clock
        widget: clock
        bind: clock.local
        visible: true
        rect: { x: 8, y: 4, width: 60, height: 18 }
        zIndex: 20
        style: { foreground: "#F5F7FB", fontSize: 12 }

      - id: agent
        widget: agent_badge
        bind: agent.source
        visible: true
        rect: { x: 73, y: 4, width: 54, height: 18 }
        zIndex: 20
        style: { foreground: "#071712", fontSize: 9 }

      - id: task_count
        widget: task_count
        bind: agent.task_count
        visible: true
        rect: { x: 132, y: 4, width: 70, height: 18 }
        zIndex: 20
        style: { foreground: "#92A1B7", fontSize: 9 }

      - id: weather
        widget: weather
        bind: weather.current
        visible: true
        rect: { x: 207, y: 4, width: 105, height: 18 }
        zIndex: 20
        style: { foreground: "#C8D3E2", fontSize: 9, align: right }

      - id: character
        widget: sprite
        bind: agent.expression
        visible: true
        rect: { x: 28, y: 30, width: 264, height: 158 }
        zIndex: 1
        props: { visual: face }

      - id: status
        widget: status_text
        bind: agent.status
        visible: true
        rect: { x: 8, y: 196, width: 304, height: 18 }
        zIndex: 30
        style: { foreground: "#D9E2EF", background: "#182435", fontSize: 10, radius: 5, align: center }

      - id: quota_5h
        widget: usage_bar
        bind: usage.codex.five_hour
        visible: true
        rect: { x: 8, y: 218, width: 145, height: 18 }
        zIndex: 30
        props: { label: "5H", value_mode: remaining, show_percent: true, show_reset: false }
        style: { foreground: "#EAF1FA", normal: "#59D185", low: "#FFB020", critical: "#FF4D4F", fontSize: 8 }

      - id: quota_week
        widget: usage_bar
        bind: usage.codex.weekly
        visible: true
        rect: { x: 167, y: 218, width: 145, height: 18 }
        zIndex: 30
        props: { label: "7D", value_mode: remaining, show_percent: true, show_reset: false }
        style: { foreground: "#EAF1FA", normal: "#59D185", low: "#FFB020", critical: "#FF4D4F", fontSize: 8 }

  working:
    extends: base
    overrides:
      character:
        props: { ambient: focused }

  idle:
    extends: base
    overrides:
      character:
        props: { ambient: breathing }

  waiting:
    extends: base
    overrides:
      status:
        style: { background: "#49351A", foreground: "#FFD99B" }

  critical:
    extends: base
    overrides:
      quota_5h: { visible: false }
      quota_week: { visible: false }
      status:
        rect: { x: 8, y: 207, width: 304, height: 25 }
        style: { background: "#5A2028", foreground: "#FFFFFF", fontSize: 12 }
