[platformio]
default_envs = stackchan-cores3

[env:stackchan-cores3]
; StackChan-BSP 1.1.0 uses ESP-IDF 5 UART symbols. Pin the pioarduino
; platform so a fresh checkout does not silently fall back to Arduino-ESP32 2.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = m5stack-cores3
framework = arduino
extra_scripts = pre:scripts/patch_servo_bsp.py
monitor_speed = 921600
upload_speed = 1500000
board_build.partitions = default_16MB.csv
build_unflags =
  -std=gnu++11
build_flags =
  -I include
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DAGENTLING_PROTOCOL_VERSION=1
lib_deps =
  ; StackChan-BSP 1.1.0 implements the IOExpander interface used through 0.2.15.
  m5stack/M5Unified @ 0.2.15
  https://github.com/m5stack/StackChan-BSP.git#1.1.0
  bblanchon/ArduinoJson @ ^7.4.2

; Uses the original vendor transport directly, without Motion or our adapter.
[env:servo-baseline]
extends = env:stackchan-cores3
extra_scripts =
build_src_filter = -<*> +<../diagnostics/servo-baseline.cpp>
